name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r controller/requirements.lock.txt
      - run: python -m pytest -q tests
      - run: node --check controller/static/app.js
      - run: python scripts/check_public_tree.py
      - name: Generated replay catalog stays reproducible
        run: |
          python scripts/generate_replay_catalog.py
          git diff --exit-code -- sketches/ACStateControl/CapturedButtons.h captures/york-replay-index.json

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.5.1'
      - run: sh scripts/arduino.sh core update-index
      - run: sh scripts/arduino.sh core install arduino:avr@1.8.8
      - run: sh scripts/arduino.sh lib install 'IRremote@4.7.1'
      - name: Compile all sketches without a connected device
        run: |
          for sketch in sketches/*; do
            sh scripts/arduino.sh compile --fqbn arduino:avr:uno "$sketch"
          done
